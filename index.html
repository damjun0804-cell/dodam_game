<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스푼라디오 AI 추리게임 대시보드</title>
  <!-- Google Fonts & Bootstrap 5 & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --accent-purple: #818cf8;
      --accent-indigo: #6366f1;
      --accent-cyan: #38bdf8;
      --text-muted: #94a3b8;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      letter-spacing: -0.01em;
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: var(--card-hover-border);
    }

    .header-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.08) 100%);
      border: 1px solid rgba(168, 85, 247, 0.2);
    }

    .card-header {
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid var(--card-border);
      padding: 1.25rem 1.5rem;
      border-top-left-radius: 1.25rem !important;
      border-top-right-radius: 1.25rem !important;
    }

    /* Gradient Typography */
    .gradient-text {
      background: linear-gradient(135deg, #a5b4fc 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Custom Inputs & Controls */
    .form-control, .form-select {
      background-color: rgba(15, 23, 42, 0.6);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-control:focus, .form-select:focus {
      background-color: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      border-color: var(--accent-indigo);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .form-control::placeholder {
      color: #475569;
    }

    /* Suspect Cards Styling */
    .suspect-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 1rem;
      padding: 1.25rem;
      transition: all 0.25s ease;
    }

    .suspect-card:hover {
      background: rgba(15, 23, 42, 0.75);
      border-color: rgba(129, 140, 248, 0.3);
      transform: translateY(-2px);
    }

    .suspect-number {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-purple);
      background: rgba(129, 140, 248, 0.1);
      padding: 0.25rem 0.6rem;
      border-radius: 0.5rem;
    }

    /* Badges & Tags */
    .badge-tag {
      font-weight: 500;
      padding: 0.55em 0.9em;
      border-radius: 0.6rem;
      background: rgba(239, 68, 68, 0.15) !important;
      color: #fca5a5 !important;
      border: 1px solid rgba(239, 68, 68, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .badge-tag:hover {
      background: rgba(239, 68, 68, 0.3) !important;
      border-color: rgba(239, 68, 68, 0.5);
      transform: scale(1.03);
    }

    /* Buttons */
    .btn-gradient {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      transition: all 0.25s ease;
    }

    .btn-gradient:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    .btn-outline-glass {
      background: rgba(255, 255, 255, 0.03);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.75rem;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .btn-outline-glass:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="container py-5" style="max-width: 980px;">
    
    <!-- 헤더 영역 -->
    <div class="glass-card header-card p-4 p-md-5 mb-4 text-center">
      <span class="badge rounded-pill bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 mb-3 px-3 py-2">
        <i class="bi bi-cpu me-1"></i> AI Detective Game Console
      </span>
      <h1 class="fw-extrabold gradient-text mb-3 display-6">스푼라디오 AI 추리게임 대시보드</h1>
      <p class="text-slate-400 mb-0 mx-auto" style="max-width: 600px; color: var(--text-muted);">
        실시간 라이브 방송을 위한 추리 정답, 금지어, 용의자 프로필을 손쉽게 구성하고 동기화하세요.
      </p>
    </div>

    <!-- 1. 기본 설정 -->
    <div class="glass-card mb-4">
      <div class="card-header d-flex align-items-center justify-content-between">
        <h5 class="card-title mb-0 fw-bold text-white fs-6">
          <i class="bi bi-sliders me-2 text-indigo-400"></i>1. 게임 기본 설정
        </h5>
        <span class="text-xs text-muted">Core Settings</span>
      </div>
      <div class="card-body p-4">
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-slate-300 small">게임 진행 상태</label>
            <select id="isGameActive" class="form-select">
              <option value="true">🟢 진행 중 (Active)</option>
              <option value="false">🔴 일시 정지 (Paused)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold text-slate-300 small">추리 정답 (Target Word)</label>
            <input type="text" id="targetWord" class="form-control" placeholder="예: 바나나, 독약, 비밀열쇠">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold text-slate-300 small">금지어 목록 (엔터 키로 추가)</label>
            <div class="input-group mb-2">
              <input type="text" id="forbiddenInput" class="form-control" placeholder="금지어 입력 후 엔터 (예: 노랑, 과일, 원숭이)">
              <button class="btn btn-outline-glass px-4" type="button" onclick="addForbiddenWord()"><i class="bi bi-plus-lg"></i> 추가</button>
            </div>
            <div id="forbiddenTags" class="d-flex flex-wrap gap-2 pt-2"></div>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold text-slate-300 small">AI 진행 지침 (System Instruction)</label>
            <textarea id="systemInstruction" class="form-control" rows="3" placeholder="예: 시청자의 질문에 맞춰 용의자의 성격을 연기하며 1~2문장의 간결한 텍스트로 힌트나 대답을 작성하세요."></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 용의자 프로필 -->
    <div class="glass-card mb-4">
      <div class="card-header d-flex align-items-center justify-content-between">
        <h5 class="card-title mb-0 fw-bold text-white fs-6">
          <i class="bi bi-people me-2 text-cyan-400"></i>2. 용의자 5명 프로필 설정
        </h5>
        <span class="text-xs text-muted">Suspect Profiles</span>
      </div>
      <div class="card-body p-4">
        <div id="suspectsContainer" class="d-flex flex-column gap-3"></div>
      </div>
    </div>

    <!-- 3. GitHub 연동 및 동기화 -->
    <div class="glass-card mb-4">
      <div class="card-header d-flex align-items-center justify-content-between">
        <h5 class="card-title mb-0 fw-bold text-white fs-6">
          <i class="bi bi-cloud-arrow-up me-2 text-emerald-400"></i>3. 설정 저장 및 동기화
        </h5>
        <span class="text-xs text-muted">Sync & Export</span>
      </div>
      <div class="card-body p-4">
        <p class="mb-4 small" style="color: var(--text-muted);">
          <i class="bi bi-info-circle me-1 text-indigo-400"></i> 
          <strong>GitHub에 바로 저장</strong> 버튼을 누르면 <code>game_config.json</code> 파일이 저장소에 즉시 업로드되어 파이썬 봇이 자동 적용합니다.
        </p>
        <div class="d-flex flex-wrap gap-3">
          <button class="btn btn-gradient px-4 py-2.5" onclick="saveToGitHub()">
            <i class="bi bi-github me-2"></i>GitHub에 바로 저장
          </button>
          <button class="btn btn-outline-glass px-4 py-2.5" onclick="downloadJSON()">
            <i class="bi bi-download me-2"></i>game_config.json 수동 다운로드
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // GitHub PAT 고정 설정
    const GITHUB_PAT = "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";

    let forbiddenWords = [];

    function renderForbiddenTags() {
      const container = document.getElementById("forbiddenTags");
      container.innerHTML = "";
      forbiddenWords.forEach((word, idx) => {
        container.innerHTML += `<span class="badge badge-tag" onclick="removeForbiddenWord(${idx})">${word} <i class="bi bi-x-lg ms-1"></i></span>`;
      });
    }

    function addForbiddenWord() {
      const input = document.getElementById("forbiddenInput");
      const val = input.value.trim();
      if (val && !forbiddenWords.includes(val)) {
        forbiddenWords.push(val);
        input.value = "";
        renderForbiddenTags();
      }
    }

    function removeForbiddenWord(idx) {
      forbiddenWords.splice(idx, 1);
      renderForbiddenTags();
    }

    function renderSuspects() {
      const container = document.getElementById("suspectsContainer");
      container.innerHTML = "";
      
      const placeholders = {
        1: { name: "예: 집사", personality: "예: 정중하지만 질문이 날카로우면 신경질적임. '~입니다만' 체 사용.", alibi: "예: 밤 8시에 2층 서재에서 책상을 정리하고 있었음.", secret: "예: 서재 금고에서 돈을 훔치고 있었음." },
        2: { name: "예: 화가", personality: "예: 몽상가 스타일, 알쏭달쏭하고 시적인 말투 사용.", alibi: "예: 사건 시각에 정원에서 달빛을 보며 그림을 그리고 있었음.", secret: "예: 정원에서 수상한 인물을 목격했음." },
        3: { name: "예: 정원사", personality: "예: 무뚝뚝하고 말수가 적음. 사투리를 사용함.", alibi: "예: 온실에서 화분을 정리하고 있었음.", secret: "예: 피해자와 최근 돈 문제로 다퉜음." },
        4: { name: "예: 주방장", personality: "예: 성격이 급하고 화를 잘 냄. 요리 자부심이 강함.", alibi: "예: 주방에서 저녁 식사 설거지를 하고 있었음.", secret: "예: 피해자의 음식에 약을 타려고 했음." },
        5: { name: "예: 친척", personality: "예: 차갑고 이기적임. 유산에 관심이 많음.", alibi: "예: 응접실에서 혼자 포도주를 마시고 있었음.", secret: "예: 피해자의 유언장을 몰래 확인했었음." }
      };

      for (let i = 1; i <= 5; i++) {
        const ph = placeholders[i];
        container.innerHTML += `
          <div class="suspect-card">
            <div class="d-flex align-items-center mb-3">
              <span class="suspect-number me-2">Suspect 0${i}</span>
              <span class="fw-semibold text-slate-200 small">용의자 ${i} 프로필</span>
            </div>
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label text-slate-400 text-xs mb-1">이름 / 역할</label>
                <input type="text" id="suspect_${i}_name" class="form-control" placeholder="${ph.name}">
              </div>
              <div class="col-md-9">
                <label class="form-label text-slate-400 text-xs mb-1">성격 / 말투 지침</label>
                <input type="text" id="suspect_${i}_personality" class="form-control" placeholder="${ph.personality}">
              </div>
              <div class="col-md-6">
                <label class="form-label text-slate-400 text-xs mb-1">알리바이</label>
                <input type="text" id="suspect_${i}_alibi" class="form-control" placeholder="${ph.alibi}">
              </div>
              <div class="col-md-6">
                <label class="form-label text-slate-400 text-xs mb-1">숨겨진 비밀</label>
                <input type="text" id="suspect_${i}_secret" class="form-control" placeholder="${ph.secret}">
              </div>
            </div>
          </div>`;
      }
    }

    function buildConfigJSON() {
      const suspects = {};
      for (let i = 1; i <= 5; i++) {
        suspects[i] = {
          name: document.getElementById(`suspect_${i}_name`).value,
          personality: document.getElementById(`suspect_${i}_personality`).value,
          alibi: document.getElementById(`suspect_${i}_alibi`).value,
          secret: document.getElementById(`suspect_${i}_secret`).value
        };
      }
      return {
        is_game_active: document.getElementById("isGameActive").value === "true",
        target_word: document.getElementById("targetWord").value,
        forbidden_words: forbiddenWords,
        system_instruction: document.getElementById("systemInstruction").value,
        suspects: suspects
      };
    }

    function downloadJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(buildConfigJSON(), null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "game_config.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    async function saveToGitHub() {
      const token = GITHUB_PAT;
      const configData = buildConfigJSON();
      const owner = "damjun0804-cell";
      const repo = "dodam_game";
      const path = "game_config.json";
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

      try {
        let sha = "";
        const getRes = await fetch(url, { headers: { "Authorization": `token ${token}` } });
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }

        const body = {
          message: "Update game_config.json via Dashboard",
          content: btoa(unescape(encodeURIComponent(JSON.stringify(configData, null, 2)))),
          sha: sha || undefined
        };

        const putRes = await fetch(url, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        if (putRes.ok) alert("GitHub 저장 완료!");
        else alert("저장 실패: " + putRes.statusText);
      } catch (err) {
        alert("오류 발생: " + err.message);
      }
    }

    document.getElementById("forbiddenInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") { e.preventDefault(); addForbiddenWord(); }
    });

    renderForbiddenTags();
    renderSuspects();
  </script>
</body>
</html>
