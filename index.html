<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추리 게임 관리자 대시보드</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: #fafbfc;
        }
        .section-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #34495e;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #27ae60;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1f6391;
        }
        .suspect-box {
            background: #fff;
            padding: 10px;
            margin-top: 10px;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 추리 게임 관리자 대시보드</h1>

    <!-- GitHub 토큰 입력 섹션 -->
    <div class="section">
        <div class="section-title">🔑 GitHub 인증 설정</div>
        <label for="githubToken">Personal Access Token (classic)</label>
        <input type="password" id="githubToken" placeholder="ghp_... 토큰을 입력하세요">
        <small style="color: #666; display: block; margin-top: 5px;">* 토큰은 브라우저(localStorage)에 안전하게 임시 저장됩니다.</small>
    </div>

    <!-- 게임 활성화 상태 -->
    <div class="section toggle-container">
        <span class="section-title">게임 진행 상태 (ON/OFF)</span>
        <label class="switch">
            <input type="checkbox" id="isGameActive">
            <span class="slider"></span>
        </label>
    </div>

    <!-- 기본 설정 -->
    <div class="section">
        <div class="section-title">📌 기본 단어 설정</div>
        <label for="targetWord">정답 단어 (Target Word)</label>
        <input type="text" id="targetWord" placeholder="예: 시계">

        <label for="forbiddenWords">금지어 (쉼표로 구분)</label>
        <input type="text" id="forbiddenWords" placeholder="예: 시간, 분, 초, 태엽">

        <label for="systemInstruction">AI 행동 지침 (Prompt Instruction)</label>
        <textarea id="systemInstruction" placeholder="AI에게 전달할 기본 가이드라인을 입력하세요."></textarea>
    </div>

    <!-- 용의자 정보 -->
    <div class="section">
        <div class="section-title">👤 용의자 프로필 설정</div>
        
        <div class="suspect-box">
            <strong>용의자 1</strong>
            <input type="text" id="suspect1Name" placeholder="이름">
            <input type="text" id="suspect1Personality" placeholder="성격">
            <input type="text" id="suspect1Alibi" placeholder="알리바이">
            <input type="text" id="suspect1Secret" placeholder="비밀">
        </div>

        <div class="suspect-box">
            <strong>용의자 2</strong>
            <input type="text" id="suspect2Name" placeholder="이름">
            <input type="text" id="suspect2Personality" placeholder="성격">
            <input type="text" id="suspect2Alibi" placeholder="알리바이">
            <input type="text" id="suspect2Secret" placeholder="비밀">
        </div>

        <div class="suspect-box">
            <strong>용의자 3</strong>
            <input type="text" id="suspect3Name" placeholder="이름">
            <input type="text" id="suspect3Personality" placeholder="성격">
            <input type="text" id="suspect3Alibi" placeholder="알리바이">
            <input type="text" id="suspect3Secret" placeholder="비밀">
        </div>
    </div>

    <button onclick="saveConfig()">💾 설정 저장 및 적용</button>
</div>

<script>
    const REPO_OWNER = "damjun0804-cell";
    const REPO_NAME = "dodam_game";
    const FILE_PATH = "game_config.json";

    // 페이지 로드 시 localStorage에서 토큰 복원 및 기존 JSON 데이터 동기화
    window.onload = async function() {
        const savedToken = localStorage.getItem("dodam_github_token");
        if (savedToken) {
            document.getElementById("githubToken").value = savedToken;
            loadRemoteConfig(savedToken);
        }
    };

    async function loadRemoteConfig(token) {
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: {
                    "Authorization": `token ${token}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            });

            if (res.ok) {
                const data = await res.json();
                const content = decodeURIComponent(escape(atob(data.content)));
                const config = JSON.parse(content);

                document.getElementById("isGameActive").checked = config.is_game_active || false;
                document.getElementById("targetWord").value = config.target_word || "";
                document.getElementById("forbiddenWords").value = (config.forbidden_words || []).join(", ");
                document.getElementById("systemInstruction").value = config.system_instruction || "";

                if (config.suspects) {
                    if (config.suspects["1"]) {
                        document.getElementById("suspect1Name").value = config.suspects["1"].name || "";
                        document.getElementById("suspect1Personality").value = config.suspects["1"].personality || "";
                        document.getElementById("suspect1Alibi").value = config.suspects["1"].alibi || "";
                        document.getElementById("suspect1Secret").value = config.suspects["1"].secret || "";
                    }
                    if (config.suspects["2"]) {
                        document.getElementById("suspect2Name").value = config.suspects["2"].name || "";
                        document.getElementById("suspect2Personality").value = config.suspects["2"].personality || "";
                        document.getElementById("suspect2Alibi").value = config.suspects["2"].alibi || "";
                        document.getElementById("suspect2Secret").value = config.suspects["2"].secret || "";
                    }
                    if (config.suspects["3"]) {
                        document.getElementById("suspect3Name").value = config.suspects["3"].name || "";
                        document.getElementById("suspect3Personality").value = config.suspects["3"].personality || "";
                        document.getElementById("suspect3Alibi").value = config.suspects["3"].alibi || "";
                        document.getElementById("suspect3Secret").value = config.suspects["3"].secret || "";
                    }
                }
            }
        } catch (err) {
            console.error("기존 설정 로드 실패:", err);
        }
    }

    async function saveConfig() {
        const token = document.getElementById("githubToken").value.trim();
        if (!token) {
            alert("GitHub Personal Access Token을 입력해주세요!");
            return;
        }

        // 입력받은 토큰을 브라우저에 임시 저장
        localStorage.setItem("dodam_github_token", token);

        const forbiddenArray = document.getElementById("forbiddenWords").value
            .split(",")
            .map(item => item.trim())
            .filter(item => item !== "");

        const updatedConfig = {
            is_game_active: document.getElementById("isGameActive").checked,
            target_word: document.getElementById("targetWord").value.trim(),
            forbidden_words: forbiddenArray,
            system_instruction: document.getElementById("systemInstruction").value,
            suspects: {
                "1": {
                    name: document.getElementById("suspect1Name").value.trim(),
                    personality: document.getElementById("suspect1Personality").value.trim(),
                    alibi: document.getElementById("suspect1Alibi").value.trim(),
                    secret: document.getElementById("suspect1Secret").value.trim()
                },
                "2": {
                    name: document.getElementById("suspect2Name").value.trim(),
                    personality: document.getElementById("suspect2Personality").value.trim(),
                    alibi: document.getElementById("suspect2Alibi").value.trim(),
                    secret: document.getElementById("suspect2Secret").value.trim()
                },
                "3": {
                    name: document.getElementById("suspect3Name").value.trim(),
                    personality: document.getElementById("suspect3Personality").value.trim(),
                    alibi: document.getElementById("suspect3Alibi").value.trim(),
                    secret: document.getElementById("suspect3Secret").value.trim()
                }
            }
        };

        try {
            const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: {
                    "Authorization": `token ${token}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            });

            if (getRes.status === 401) {
                alert("GitHub 토큰 인증 실패 (401 Unauthorized). 토큰 값과 권한(repo)을 재확인해주세요.");
                return;
            }

            let sha = "";
            if (getRes.ok) {
                const getData = await getRes.json();
                sha = getData.sha;
            }

            const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(updatedConfig, null, 2))));

            const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Update game config from Web Dashboard",
                    content: encodedContent,
                    sha: sha
                })
            });

            if (putRes.ok) {
                alert("✅ 설정이 정상적으로 저장되었습니다!");
            } else {
                const errorData = await putRes.json();
                alert("저장 실패: " + (errorData.message || putRes.statusText));
            }
        } catch (err) {
            console.error("저장 오류:", err);
            alert("저장 처리 중 오류가 발생했습니다: " + err.message);
        }
    }
</script>

</body>
</html>
