<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️‍♂️ 명탐정 코난: 사건 해결 관리자 대시보드</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f30;
            --card-border: #1e2d4a;
            --accent-blue: #00a2ff;
            --accent-red: #ff3366;
            --accent-yellow: #f1c40f;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 162, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 51, 102, 0.05) 0%, transparent 20%);
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 162, 255, 0.1);
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(0, 162, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
        }

        .section-title {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 15px;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(0, 162, 255, 0.2);
            padding-bottom: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background-color: #0b1120;
            border: 1px solid #2a3b5c;
            border-radius: 8px;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(0, 162, 255, 0.4);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        /* 금지어 태그 입출력 스타일 */
        .forbidden-input-group {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .forbidden-input-group input {
            margin-top: 0;
            flex: 1;
        }

        .btn-add {
            padding: 0 18px;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-add:hover {
            background: #0081cc;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            min-height: 38px;
            padding: 6px;
            background: #0b1120;
            border: 1px dashed #2a3b5c;
            border-radius: 8px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 51, 102, 0.15);
            color: #ff6688;
            border: 1px solid rgba(255, 51, 102, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .tag .remove-btn {
            margin-left: 6px;
            cursor: pointer;
            font-weight: bold;
            color: var(--accent-red);
        }

        .tag .remove-btn:hover {
            color: #ffffff;
        }

        /* 토글 스위치 디자인 */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 54px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2a3b5c;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* 용의자 카드 스타일 */
        .suspect-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .suspect-box {
            background: #0f172a;
            padding: 15px;
            border: 1px solid #1e293b;
            border-left: 4px solid var(--accent-yellow);
            border-radius: 8px;
        }

        .suspect-title {
            font-weight: bold;
            color: var(--accent-yellow);
            margin-bottom: 8px;
            display: block;
        }

        .suspect-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .suspect-inputs input {
            margin-top: 0;
        }

        .suspect-inputs input:nth-child(3),
        .suspect-inputs input:nth-child(4) {
            grid-column: span 1;
        }

        /* 메인 저장 버튼 */
        .btn-save {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00a2ff, #0055ff);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 162, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 162, 255, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🕵️‍♂️ 명탐정 코난: 추리 게임 본부</h1>

    <!-- GitHub 토큰 인증 섹션 -->
    <div class="section">
        <div class="section-title">🔑 본부 인증 (GitHub Token)</div>
        <label for="githubToken">Personal Access Token (classic)</label>
        <input type="password" id="githubToken" placeholder="ghp_... 토큰을 입력하세요">
        <small style="color: var(--text-sub); display: block; margin-top: 6px;">* 토큰은 브라우저(localStorage)에 임시 저장됩니다.</small>
    </div>

    <!-- 게임 활성화 상태 -->
    <div class="section toggle-container">
        <span class="section-title" style="margin-bottom:0; border:none;">🚨 사건 추리 가동 상태 (ON/OFF)</span>
        <label class="switch">
            <input type="checkbox" id="isGameActive">
            <span class="slider"></span>
        </label>
    </div>

    <!-- 기본 단어 및 규칙 설정 -->
    <div class="section">
        <div class="section-title">🎯 사건 핵심 암호 설정</div>
        
        <label for="targetWord">정답 단어 (Target Word)</label>
        <input type="text" id="targetWord" placeholder="예: 시계">

        <label>금지어 (Enter키 또는 추가 버튼으로 등록)</label>
        <div class="forbidden-input-group">
            <input type="text" id="forbiddenInput" placeholder="금지할 단어 입력 후 Enter">
            <button class="btn-add" onclick="addForbiddenWord()">추가</button>
        </div>
        <div class="tag-container" id="tagContainer"></div>

        <label for="systemInstruction" style="margin-top: 15px;">AI 지휘관 프로필 수칙 (Prompt Instruction)</label>
        <textarea id="systemInstruction" placeholder="AI 행동 지침을 입력하세요."></textarea>
    </div>

    <!-- 용의자 프로필 설정 (1~5명) -->
    <div class="section">
        <div class="section-title">👥 용의자 5인 용의선상</div>
        <div class="suspect-grid">
            <!-- 용의자 1~5 -->
            <script>
                for(let i=1; i<=5; i++) {
                    document.write(`
                        <div class="suspect-box">
                            <span class="suspect-title">용의자 ${i}</span>
                            <div class="suspect-inputs">
                                <input type="text" id="suspect${i}Name" placeholder="이름">
                                <input type="text" id="suspect${i}Personality" placeholder="성격">
                                <input type="text" id="suspect${i}Alibi" placeholder="알리바이">
                                <input type="text" id="suspect${i}Secret" placeholder="비밀">
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>

    <button class="btn-save" onclick="saveConfig()">💾 데이터 저장 및 현장 적용</button>
</div>

<script>
    const REPO_OWNER = "damjun0804-cell";
    const REPO_NAME = "dodam_game";
    const FILE_PATH = "game_config.json";

    let forbiddenWordsList = [];

    // 금지어 태그 관련 조작
    const forbiddenInput = document.getElementById("forbiddenInput");
    forbiddenInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            addForbiddenWord();
        }
    });

    function addForbiddenWord() {
        const val = forbiddenInput.value.trim();
        if (val && !forbiddenWordsList.includes(val)) {
            forbiddenWordsList.push(val);
            renderTags();
            forbiddenInput.value = "";
        }
    }

    function removeForbiddenWord(word) {
        forbiddenWordsList = forbiddenWordsList.filter(item => item !== word);
        renderTags();
    }

    function renderTags() {
        const container = document.getElementById("tagContainer");
        container.innerHTML = "";
        forbiddenWordsList.forEach(word => {
            const tag = document.createElement("div");
            tag.className = "tag";
            tag.innerHTML = `${word} <span class="remove-btn" onclick="removeForbiddenWord('${word}')">&times;</span>`;
            container.appendChild(tag);
        });
    }

    // 데이터 로드
    window.onload = async function() {
        const savedToken = localStorage.getItem("dodam_github_token");
        if (savedToken) {
            document.getElementById("githubToken").value = savedToken;
            loadRemoteConfig(savedToken);
        }
    };

    async function loadRemoteConfig(token) {
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: {
                    "Authorization": `token ${token}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            });

            if (res.ok) {
                const data = await res.json();
                const content = decodeURIComponent(escape(atob(data.content)));
                const config = JSON.parse(content);

                document.getElementById("isGameActive").checked = config.is_game_active || false;
                document.getElementById("targetWord").value = config.target_word || "";
                document.getElementById("systemInstruction").value = config.system_instruction || "";

                forbiddenWordsList = config.forbidden_words || [];
                renderTags();

                if (config.suspects) {
                    for (let i = 1; i <= 5; i++) {
                        const key = String(i);
                        if (config.suspects[key]) {
                            document.getElementById(`suspect${i}Name`).value = config.suspects[key].name || "";
                            document.getElementById(`suspect${i}Personality`).value = config.suspects[key].personality || "";
                            document.getElementById(`suspect${i}Alibi`).value = config.suspects[key].alibi || "";
                            document.getElementById(`suspect${i}Secret`).value = config.suspects[key].secret || "";
                        }
                    }
                }
            }
        } catch (err) {
            console.error("설정 데이터 불러오기 실패:", err);
        }
    }

    // 데이터 저장
    async function saveConfig() {
        const token = document.getElementById("githubToken").value.trim();
        if (!token) {
            alert("GitHub Personal Access Token을 입력해주세요!");
            return;
        }

        localStorage.setItem("dodam_github_token", token);

        const suspectsObj = {};
        for (let i = 1; i <= 5; i++) {
            suspectsObj[String(i)] = {
                name: document.getElementById(`suspect${i}Name`).value.trim(),
                personality: document.getElementById(`suspect${i}Personality`).value.trim(),
                alibi: document.getElementById(`suspect${i}Alibi`).value.trim(),
                secret: document.getElementById(`suspect${i}Secret`).value.trim()
            };
        }

        const updatedConfig = {
            is_game_active: document.getElementById("isGameActive").checked,
            target_word: document.getElementById("targetWord").value.trim(),
            forbidden_words: forbiddenWordsList,
            system_instruction: document.getElementById("systemInstruction").value,
            suspects: suspectsObj
        };

        try {
            const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: {
                    "Authorization": `token ${token}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            });

            if (getRes.status === 401) {
                alert("인증 실패 (401 Unauthorized). 토큰 권한(repo) 및 스펠링을 재확인하세요.");
                return;
            }

            let sha = "";
            if (getRes.ok) {
                const getData = await getRes.json();
                sha = getData.sha;
            }

            const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(updatedConfig, null, 2))));

            const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Update game config via Detective Conan Dashboard",
                    content: encodedContent,
                    sha: sha
                })
            });

            if (putRes.ok) {
                alert("🕵️‍♂️ 사건 설정 변경사항이 정상적으로 적용되었습니다!");
            } else {
                const errorData = await putRes.json();
                alert("저장 실패: " + (errorData.message || putRes.statusText));
            }
        } catch (err) {
            console.error("저장 오류:", err);
            alert("저장 처리 중 오류 발생: " + err.message);
        }
    }
</script>

</body>
</html>
