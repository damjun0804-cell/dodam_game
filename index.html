<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스푼라디오 봇 관리자 대시보드</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
            --accent: #ff5722;
            --border: #333333;
        }
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: var(--accent);
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-sub);
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        small {
            display: block;
            margin-top: 6px;
            color: var(--text-sub);
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e64a19;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>스푼라디오 봇 제어판</h2>
        
        <div class="form-group">
            <label for="broadcastId">방송 ID 또는 고유닉 (ID / Tag)</label>
            <input type="text" id="broadcastId" placeholder="예: 방송 고유 ID 또는 주소의 ID 부분 입력">
            <small>* 웹소켓 주소를 직접 넣을 필요 없이, 방송 ID나 고유닉만 입력하면 자동으로 연동됩니다.</small>
        </div>

        <div class="form-group">
            <label for="token">스푼 인증 토큰 (Token)</label>
            <input type="password" id="token" placeholder="Bearer 토큰 값 입력">
            <small>* API 호출 및 웹소켓 인증에 사용되는 토큰입니다.</small>
        </div>

        <button onclick="saveConfig()">설정 저장 및 봇 시작</button>
        <div id="status"></div>
    </div>

    <script>
        async function saveConfig() {
            const broadcastId = document.getElementById('broadcastId').value.trim();
            const token = document.getElementById('token').value.trim();
            const statusDiv = document.getElementById('status');

            if (!broadcastId || !token) {
                statusDiv.style.color = '#ff5252';
                statusDiv.innerText = '방송 ID와 토큰을 모두 입력해주세요.';
                return;
            }

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ broadcast_id: broadcastId, token: token })
                });

                const result = await response.json();
                if (response.ok) {
                    statusDiv.style.color = '#4caf50';
                    statusDiv.innerText = '설정이 저장되고 봇이 성공적으로 실행되었습니다!';
                } else {
                    statusDiv.style.color = '#ff5252';
                    statusDiv.innerText = '설정 저장 실패: ' + (result.message || '알 수 없는 오류');
                }
            } catch (error) {
                statusDiv.style.color = '#ff5252';
                statusDiv.innerText = '서버 통신 중 오류가 발생했습니다.';
            }
        }
    </script>
</body>
</html>
