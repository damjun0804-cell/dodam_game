<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스푼라디오 AI 추리게임 대시보드</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .header-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 1rem;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .card-header {
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      border-top-left-radius: 0.75rem !important;
      border-top-right-radius: 0.75rem !important;
    }
    .form-control, .form-select {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 0.5rem;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0f172a;
      color: #f8fafc;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }
    .form-control::placeholder {
      color: #64748b;
    }
    .badge-tag {
      cursor: pointer;
      font-weight: 500;
      padding: 0.5em 0.8em;
      border-radius: 0.375rem;
      transition: all 0.2s ease;
    }
    .badge-tag:hover {
      background-color: #ef4444 !important;
      transform: translateY(-1px);
    }
    .suspect-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.5rem;
    }
    .btn-primary {
      background-color: #2563eb;
      border-color: #2563eb;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container py-5" style="max-width: 960px;">
    <!-- 헤더 -->
    <div class="header-card p-4 mb-4 text-center">
      <h2 class="fw-bold text-primary mb-2"><i class="bi bi-search"></i> 스푼라디오 AI 추리게임 관리 대시보드</h2>
      <p class="text-secondary mb-0">실시간 방송 진행에 필요한 정답, 금지어, 용의자 5명의 정보를 설정하고 동기화하세요.</p>
    </div>

    <!-- 1. 기본 설정 -->
    <div class="card mb-4">
      <div class="card-header py-3">
        <h5 class="card-title mb-0 fw-bold text-white"><i class="bi bi-gear-fill me-2 text-primary"></i>1. 게임 기본 설정</h5>
      </div>
      <div class="card-body p-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-light">게임 진행 상태</label>
            <select id="isGameActive" class="form-select">
              <option value="true">🟢 진행 중 (Active)</option>
              <option value="false">🔴 일시 정지 (Paused)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold text-light">추리 정답 (Target Word)</label>
            <input type="text" id="targetWord" class="form-control" placeholder="예: 바나나, 독약, 비밀열쇠">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold text-light">금지어 목록 (엔터 키로 추가)</label>
            <div class="input-group mb-2">
              <input type="text" id="forbiddenInput" class="form-control" placeholder="금지어 입력 후 엔터 (예: 노랑, 과일, 원숭이)">
              <button class="btn btn-outline-secondary" type="button" onclick="addForbiddenWord()"><i class="bi bi-plus-lg"></i> 추가</button>
            </div>
            <div id="forbiddenTags" class="d-flex flex-wrap gap-2 pt-1"></div>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold text-light">AI 진행 지침 (System Instruction)</label>
            <textarea id="systemInstruction" class="form-control" rows="2" placeholder="예: 시청자의 질문에 맞춰 용의자의 성격을 연기하며 1~2문장의 간결한 텍스트로 힌트나 대답을 작성하세요."></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 용의자 프로필 -->
    <div class="card mb-4">
      <div class="card-header py-3">
        <h5 class="card-title mb-0 fw-bold text-white"><i class="bi bi-people-fill me-2 text-info"></i>2. 용의자 5명 프로필 설정</h5>
      </div>
      <div class="card-body p-4">
        <div id="suspectsContainer" class="d-flex flex-column gap-3"></div>
      </div>
    </div>

    <!-- 3. GitHub 연동 및 다운로드 -->
    <div class="card mb-4">
      <div class="card-header py-3">
        <h5 class="card-title mb-0 fw-bold text-white"><i class="bi bi-cloud-arrow-up-fill me-2 text-success"></i>3. 설정 저장 및 동기화</h5>
      </div>
      <div class="card-body p-4">
        <p class="text-slate-400 mb-3"><i class="bi bi-info-circle me-1"></i> [GitHub에 바로 저장] 버튼을 누르면 <code>game_config.json</code> 파일이 저장소에 즉시 업데이트됩니다.</p>
        <div class="d-flex gap-2">
          <button class="btn btn-primary px-4 py-2" onclick="saveToGitHub()"><i class="bi bi-github me-1"></i> GitHub에 바로 저장</button>
          <button class="btn btn-outline-light px-4 py-2" onclick="downloadJSON()"><i class="bi bi-download me-1"></i> game_config.json 수동 다운로드</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // GitHub PAT 고정 설정
    const GITHUB_PAT = "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";

    let forbiddenWords = [];

    function renderForbiddenTags() {
      const container = document.getElementById("forbiddenTags");
      container.innerHTML = "";
      forbiddenWords.forEach((word, idx) => {
        container.innerHTML += `<span class="badge bg-danger badge-tag" onclick="removeForbiddenWord(${idx})">${word} <i class="bi bi-x-lg ms-1"></i></span>`;
      });
    }

    function addForbiddenWord() {
      const input = document.getElementById("forbiddenInput");
      const val = input.value.trim();
      if (val && !forbiddenWords.includes(val)) {
        forbiddenWords.push(val);
        input.value = "";
        renderForbiddenTags();
      }
    }

    function removeForbiddenWord(idx) {
      forbiddenWords.splice(idx, 1);
      renderForbiddenTags();
    }

    function renderSuspects() {
      const container = document.getElementById("suspectsContainer");
      container.innerHTML = "";
      
      const placeholders = {
        1: { name: "예: 집사", personality: "예: 정중하지만 질문이 날카로우면 신경질적임. '~입니다만' 체 사용.", alibi: "예: 밤 8시에 2층 서재에서 책상을 정리하고 있었음.", secret: "예: 서재 금고에서 돈을 훔치고 있었음." },
        2: { name: "예: 화가", personality: "예: 몽상가 스타일, 알쏭달쏭하고 시적인 말투 사용.", alibi: "예: 사건 시각에 정원에서 달빛을 보며 그림을 그리고 있었음.", secret: "예: 정원에서 수상한 인물을 목격했음." },
        3: { name: "예: 정원사", personality: "예: 무뚝뚝하고 말수가 적음. 사투리를 사용함.", alibi: "예: 온실에서 화분을 정리하고 있었음.", secret: "예: 피해자와 최근 돈 문제로 다퉜음." },
        4: { name: "예: 주방장", personality: "예: 성격이 급하고 화를 잘 냄. 요리 자부심이 강함.", alibi: "예: 주방에서 저녁 식사 설거지를 하고 있었음.", secret: "예: 피해자의 음식에 약을 타려고 했음." },
        5: { name: "예: 친척", personality: "예: 차갑고 이기적임. 유산에 관심이 많음.", alibi: "예: 응접실에서 혼자 포도주를 마시고 있었음.", secret: "예: 피해자의 유언장을 몰래 확인했었음." }
      };

      for (let i = 1; i <= 5; i++) {
        const ph = placeholders[i];
        container.innerHTML += `
          <div class="suspect-card p-3">
            <h6 class="text-info fw-bold mb-3"><i class="bi bi-person-bounding-box me-1"></i> 용의자 ${i}</h6>
            <div class="row g-2">
              <div class="col-md-3">
                <input type="text" id="suspect_${i}_name" class="form-control" placeholder="${ph.name}">
              </div>
              <div class="col-md-9">
                <input type="text" id="suspect_${i}_personality" class="form-control" placeholder="${ph.personality}">
              </div>
              <div class="col-md-6">
                <input type="text" id="suspect_${i}_alibi" class="form-control" placeholder="${ph.alibi}">
              </div>
              <div class="col-md-6">
                <input type="text" id="suspect_${i}_secret" class="form-control" placeholder="${ph.secret}">
              </div>
            </div>
          </div>`;
      }
    }

    function buildConfigJSON() {
      const suspects = {};
      for (let i = 1; i <= 5; i++) {
        suspects[i] = {
          name: document.getElementById(`suspect_${i}_name`).value,
          personality: document.getElementById(`suspect_${i}_personality`).value,
          alibi: document.getElementById(`suspect_${i}_alibi`).value,
          secret: document.getElementById(`suspect_${i}_secret`).value
        };
      }
      return {
        is_game_active: document.getElementById("isGameActive").value === "true",
        target_word: document.getElementById("targetWord").value,
        forbidden_words: forbiddenWords,
        system_instruction: document.getElementById("systemInstruction").value,
        suspects: suspects
      };
    }

    function downloadJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(buildConfigJSON(), null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "game_config.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    async function saveToGitHub() {
      const token = GITHUB_PAT;
      const configData = buildConfigJSON();
      const owner = "damjun0804-cell";
      const repo = "dodam_game";
      const path = "game_config.json";
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

      try {
        let sha = "";
        const getRes = await fetch(url, { headers: { "Authorization": `token ${token}` } });
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }

        const body = {
          message: "Update game_config.json via Dashboard",
          content: btoa(unescape(encodeURIComponent(JSON.stringify(configData, null, 2)))),
          sha: sha || undefined
        };

        const putRes = await fetch(url, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        if (putRes.ok) alert("GitHub 저장 완료!");
        else alert("저장 실패: " + putRes.statusText);
      } catch (err) {
        alert("오류 발생: " + err.message);
      }
    }

    document.getElementById("forbiddenInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") { e.preventDefault(); addForbiddenWord(); }
    });

    renderForbiddenTags();
    renderSuspects();
  </script>
</body>
</html>
